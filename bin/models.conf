# Model table: which engine and model handle each kind of task at each level.
# Rows are tried top to bottom for a (kind, level) pair; the first engine that is
# not on quota cooldown runs it, the next one takes over if it runs out of quota.
#
#   kind   back (logic, tests, scripts) | front (UI, motion) | read (analysis) | mech (repetitive)
#   level  facil | normal | dificil | * (any)
#   effort Codex reasoning effort; "-" leaves the engine default (agy encodes it in the model name)
#
# Copy this file to ~/.config/ia-relevo/models.conf to override it.

# kind  level    engine  model                     effort
mech    *        agy     gemini-3.8-flash-low      -
mech    *        codex   gpt-5.6-luna              low

read    *        agy     gemini-3.8-flash-high     -
read    *        codex   gpt-reserve               medium

back    facil    codex   gpt-5.6-luna              medium
back    facil    agy     gemini-3.8-flash-medium   -
back    normal   codex   gpt-reserve               high
back    normal   agy     claude-sonnet-5-5-medium  -
back    dificil  agy     claude-opus-5-5-high      -
back    dificil  codex   gpt-6-astra               high

front   facil    agy     gemini-3.8-flash-medium   -
front   facil    codex   gpt-5.6-luna              medium
front   normal   agy     claude-sonnet-5-5-medium  -
front   normal   codex   gpt-reserve               medium
front   dificil  agy     claude-opus-5-5-high      -
front   dificil  codex   gpt-6-astra               high
